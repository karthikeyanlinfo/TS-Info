<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in flight — Toxin Solutions</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050506">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..900&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 48px 16px; position: relative; overflow: hidden; }
    .nf-code { font-family: var(--display); font-weight: 900; font-size: clamp(7rem, 30vw, 22rem); line-height: .8; letter-spacing: -.06em; color: transparent; -webkit-text-stroke: 1px rgba(237,234,228,.18); position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .nf img { width: min(300px, 64vw); margin: 0 auto 28px; filter: drop-shadow(0 20px 50px rgba(227,18,44,.45)); animation: float 6s ease-in-out infinite; }
    .nf .h2 { margin-bottom: 18px; }
    .nf p { color: var(--muted); margin-bottom: 30px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-code" aria-hidden="true">404</div>
    <div style="position:relative">
      <img src="/assets/mark.webp" alt="" width="537" height="402">
      <h1 class="h2">Lost <em>in flight.</em></h1>
      <p>The page you’re looking for has flown elsewhere.</p>
      <a class="btn btn--red" href="/">Back to home <span aria-hidden="true">→</span></a>
    </div>
  </main>
</body>
</html>
